[project]
name = "licitagoias"
version = "0.1.0"
description = "Coleta, curadoria e segmentacao de oportunidades de licitacao em Goias."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "requests>=2.32.0",
  "playwright>=1.45.0",
  "python-dateutil>=2.9.0",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi[standard]>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27,<1",
]

[project.scripts]
licitagoias = "licitagoias.cli:main"
licitagoias-notify = "licitagoias.notifications_worker:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
licitagoias = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
