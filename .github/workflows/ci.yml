name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: licitagoias
          POSTGRES_PASSWORD: licitagoias_ci
          POSTGRES_DB: licitagoias
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licitagoias -d licitagoias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LICITAGOIAS_ENV: local
      LICITAGOIAS_DATABASE_URL: postgresql+psycopg://licitagoias:licitagoias_ci@localhost:5432/licitagoias
      LICITAGOIAS_SUPABASE_URL: https://example.supabase.co
      LICITAGOIAS_SUPABASE_PUBLISHABLE_KEY: ci-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check migration state
        run: alembic current
      - name: Run automated tests
        run: python -m pytest -q
      - name: Build API image
        run: docker build -t licitagoias-api:ci .
